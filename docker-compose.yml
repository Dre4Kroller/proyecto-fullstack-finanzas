version: '3.8'

services:
 postgres-db:
 image: postgres:15-alpine
 container_name: app_postgres
 restart: always
 environment:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: secretpassword
  POSTGRES_DB: finanzas_db
 ports:
 - "5432:5432"
volumes:
 - pgdata:/var/lib/postgresql/data
 
php-api:
    build: ./backend-api
    container_name: app_php_api
    restart: always
    ports:
     -"8080:80"
    volumes:
    - ./backend-api:/var/www/html
    depends_on:
    - postgres-db

node-service:
    build: ./microservice-rt
    container_name: app_node_service
    restart: always
    ports:
     - "3000:3000"
    volumes:
     - ./microservice-rt:/usr/src/app
    depends_on:
     - postgres-db

react-frontend:
  build: ./frontend
  container_name: app_react_frontend
  ports:
   - "5173:5173"
  volumes:
   - ./frontend:/app
   - /app/node_modules 
  environment:
   - CHOKIDAR_USEPOLLING=true

volumes:
 pgdata:  